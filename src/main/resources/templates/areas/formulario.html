<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gerenciar área · Alertas comunitários</title><link rel="stylesheet" th:href="@{/css/gestao.css}"></head><body class="gestao"><header class="cabecalho"><a th:href="@{/representante}">Alertas comunitários</a><nav aria-label="Navegação do representante"><a th:href="@{/areas}">Áreas</a><a th:href="@{/residencias}">Residências</a><a th:href="@{/auditoria}">Auditoria</a><form th:action="@{/sair}" method="post"><button class="secundario" type="submit">Sair</button></form></nav></header><main><h1 th:text="${id == null ? 'Cadastrar área de risco' : 'Gerenciar área de risco'}"></h1><p class="mensagem erro" role="alert" th:if="${erro}" th:text="${erro}"></p><form class="formulario" th:action="${id == null} ? @{/areas/novo} : @{/areas/{id}/editar(id=${id})}" method="post"><div class="campo"><label for="nome">Nome da área</label><input id="nome" name="nome" required th:value="${dados.nome}" aria-describedby="erro-nome" th:attr="aria-invalid=${erros.containsKey('nome')}"><p class="erro-campo" id="erro-nome" role="alert" th:text="${erros['nome']}"></p></div><div class="campo"><label for="descricao">Localização e limites</label><textarea id="descricao" name="descricaoLocalizacaoLimites" rows="5" required th:text="${dados.descricaoLocalizacaoLimites}" aria-describedby="erro-descricao" th:attr="aria-invalid=${erros.containsKey('descricao')}"></textarea><p class="erro-campo" id="erro-descricao" role="alert" th:text="${erros['descricao']}"></p></div><button type="submit" th:text="${id == null ? 'Cadastrar área' : 'Salvar alterações'}"></button></form><section class="manutencao" th:if="${id != null}"><h2>Excluir área</h2><p>A exclusão só é permitida quando não há registros vinculados.</p><form th:action="@{/areas/{id}/excluir(id=${id})}" method="post"><label class="confirmacao"><input name="confirmacao" type="checkbox" value="true" required><span>Confirmo a exclusão desta área.</span></label><button class="secundario" type="submit">Excluir área</button></form></section><p class="voltar"><a th:href="@{/areas}">Voltar para áreas</a></p></main></body></html>
