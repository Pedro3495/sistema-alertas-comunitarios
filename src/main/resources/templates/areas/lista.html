<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Áreas de risco · Alertas comunitários</title><link rel="stylesheet" th:href="@{/css/gestao.css}"></head><body class="gestao"><header class="cabecalho"><a th:href="@{/representante}">Alertas comunitários</a><nav aria-label="Navegação do representante"><a th:href="@{/areas}">Áreas</a><a th:href="@{/residencias}">Residências</a><a th:href="@{/moradores}">Moradores</a><a th:href="@{/ocorrencias}">Ocorrências</a><a th:href="@{/auditoria}">Auditoria</a><form th:action="@{/sair}" method="post"><button class="secundario" type="submit">Sair</button></form></nav></header><main><div class="titulo-acoes"><h1>Áreas de risco</h1><a class="botao" th:href="@{/areas/novo}">Cadastrar área</a></div><p>Defina o nome, a localização e os limites de cada área.</p><p class="mensagem" role="status" th:if="${param.sucesso != null}">Operação concluída.</p><form class="filtros" th:action="@{/areas}" method="get"><div><label for="nome">Nome da área</label><input id="nome" name="nome" th:value="${nome}"></div><button type="submit">Pesquisar</button><a th:href="@{/areas}">Limpar filtros</a></form><p th:if="${#lists.isEmpty(areas)}">Nenhuma área encontrada.</p><ul class="resultados"><li th:each="area : ${areas}"><div><h2 th:text="${area.nome}"></h2><p class="descricao" th:text="${area.descricaoLocalizacaoLimites}"></p></div><a class="botao secundario" th:href="@{/areas/{id}/editar(id=${area.id})}">Gerenciar área</a></li></ul></main></body></html>
