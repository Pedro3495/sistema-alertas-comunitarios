<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crie sua nova senha · Alertas comunitários</title>
  <link rel="stylesheet" th:href="@{/css/acesso.css}">
</head>
<body>
<header><a th:href="@{/}">Alertas comunitários</a></header>
<main id="conteudo">
  <h1>Crie sua nova senha</h1>
  <p class="introducao">Troque a senha temporária para continuar.</p>
  <form th:action="@{/trocar-senha}" method="post">
    <div class="campo">
      <label for="novaSenha">Nova senha</label>
      <input id="novaSenha" name="novaSenha" type="password" autocomplete="new-password" required
             aria-describedby="orientacaoSenha erroSenha" th:attr="aria-invalid=${erroSenha != null}">
      <p id="orientacaoSenha" class="orientacao">Use no mínimo 8 caracteres. Não é obrigatório combinar letras, números e símbolos.</p>
      <p id="erroSenha" class="erro-campo" role="alert" th:text="${erroSenha}"></p>
    </div>
    <button type="submit">Salvar nova senha</button>
  </form>
  <form class="sair" th:action="@{/sair}" method="post">
    <button class="secundario" type="submit">Sair da conta</button>
  </form>
</main>
</body>
</html>
