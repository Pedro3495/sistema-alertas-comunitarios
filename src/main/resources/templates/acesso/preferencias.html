<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preferências de canais · Alertas comunitários</title>
  <link rel="stylesheet" th:href="@{/css/acesso.css}">
</head>
<body>
<header><a th:href="@{/}">Alertas comunitários</a></header>
<main id="conteudo">
  <h1>Preferências de canais</h1>
  <p class="mensagem" role="status" th:if="${param.salvas}">Preferências salvas.</p>
  <p class="erro-campo" role="alert" th:if="${erro}" th:text="${erro}"></p>
  <form th:action="@{/morador/preferencias}" method="post">
    <div class="campo">
      <label for="canalCredenciais">Canal para a senha temporária e recuperação</label>
      <select id="canalCredenciais" name="canalCredenciais" required>
        <option value="SMS" th:selected="${canalCredenciais == 'SMS'}">SMS</option>
        <option value="WHATSAPP" th:selected="${canalCredenciais == 'WHATSAPP'}">WhatsApp</option>
      </select>
    </div>
    <div class="campo">
      <label for="preferenciaAlertas">Preferência para alertas</label>
      <select id="preferenciaAlertas" name="preferenciaAlertas" required aria-describedby="orientacao-alertas">
        <option value="SMS" th:selected="${preferenciaAlertas == 'SMS'}">SMS</option>
        <option value="WHATSAPP" th:selected="${preferenciaAlertas == 'WHATSAPP'}">WhatsApp</option>
        <option value="AMBOS" th:selected="${preferenciaAlertas == 'AMBOS'}">SMS e WhatsApp</option>
      </select>
      <p class="orientacao" id="orientacao-alertas">Se um canal de alerta falhar, o envio será tentado pelo outro disponível.</p>
    </div>
    <p class="orientacao">O telefone cadastrado continua o mesmo. Para trocar o número, procure a entidade pública.</p>
    <button type="submit">Salvar preferências</button>
  </form>
  <p><a th:href="@{/morador}">Voltar à minha conta</a></p>
</main>
</body>
</html>
