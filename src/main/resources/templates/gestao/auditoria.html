<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditoria · Alertas comunitários</title><link rel="stylesheet" th:href="@{/css/gestao.css}"></head>
<body class="gestao"><header class="cabecalho"><a th:href="@{/}">Alertas comunitários</a>
<nav th:if="${administrador}" aria-label="Navegação do administrador"><a th:href="@{/admin/representantes}">Representantes</a><a th:href="@{/admin/auditoria}">Auditoria</a>
<form th:action="@{/admin/sair}" method="post"><button class="secundario" type="submit">Sair</button></form></nav><a th:unless="${administrador}" th:href="@{/representante}">Voltar à minha conta</a></header><main>
<h1>Registro de auditoria</h1><p>Consulte as ações realizadas. Os registros não podem ser alterados ou excluídos.</p>
<p class="mensagem erro" role="alert" th:if="${erro}" th:text="${erro}"></p>
<form class="filtros" th:action="${administrador} ? @{/admin/auditoria} : @{/auditoria}" method="get">
<div><label for="responsavel">Responsável</label><select id="responsavel" name="responsavel"><option value="">Todos</option><option th:each="opcao : ${opcoes}" th:value="${opcao.chave}" th:text="${opcao.nome}" th:selected="${responsavel == opcao.chave}"></option></select></div>
<div><label for="acao">Ação realizada</label><input id="acao" name="acao" th:value="${acao}"></div>
<div><label for="inicio">Início do período (UTC)</label><input id="inicio" name="inicio" type="datetime-local" step="1" th:value="${inicio}"></div>
<div><label for="fim">Fim do período (UTC)</label><input id="fim" name="fim" type="datetime-local" step="1" th:value="${fim}"></div><button type="submit">Pesquisar</button></form>
<p th:if="${#lists.isEmpty(registros)}">Nenhum registro encontrado.</p>
<ul class="resultados"><li th:each="registro : ${registros}"><div><h2 th:text="${#strings.replace(registro.acao, '_', ' ')}"></h2><p>Responsável: <span th:text="${registro.responsavelTipo}"></span> #<span th:text="${registro.responsavelId}"></span></p><p>Data e hora (UTC): <time th:text="${registro.ocorridoEm}"></time></p></div></li></ul>
</main></body></html>
